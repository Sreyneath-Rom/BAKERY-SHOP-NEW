<!-- pages/components/banner-evening.html -->
 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evening Set Banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Fredoka', cursive, sans-serif; background: transparent; }

    .banner-container {
      position: relative;
      width: 1000px;
      height: 400px;
      border-radius: 20px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    }

    .banner-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .ribbon {
      position: absolute;
      top: 0;
      left: 45px;
      width: 50px;
      height: 90px;
      background-color: #462113;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
      z-index: 10;
      display: flex;
      justify-content: center;
      padding-top: 15px;
      box-shadow: 2px 5px 10px rgba(0,0,0,0.25);
    }

    .ribbon span {
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      transform: rotate(-15deg);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .text-content {
      position: absolute;
      left: 50px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .title-top {
      font-size: 64px;
      line-height: 1.1;
      color: #ffffff;
      text-shadow: -4px -4px 0 #7a3e27, 4px -4px 0 #7a3e27, -4px 4px 0 #7a3e27, 4px 4px 0 #7a3e27, 0px 8px 15px rgba(0,0,0,0.2);
    }

    .title-middle {
      font-size: 52px;
      color: #ffffff;
      text-shadow: -3px -3px 0 #7a3e27, 3px -3px 0 #7a3e27, -3px 3px 0 #7a3e27, 3px 3px 0 #7a3e27, 0px 6px 12px rgba(0,0,0,0.2);
      margin-top: -5px;
      margin-bottom: 5px;
    }

    .title-brand {
      font-family: 'Pacifico', cursive;
      font-size: 76px;
      color: #ffffff;
      text-shadow: -5px -5px 0 #7a3e27, 5px -5px 0 #7a3e27, -5px 5px 0 #7a3e27, 5px 5px 0 #7a3e27, 0px 10px 20px rgba(0,0,0,0.25);
    }

    .product-card {
      position: absolute;
      right: 40px;
      bottom: 25px;
      width: 360px;
      height: 200px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      z-index: 4;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 15px;
    }

    .price-tag {
      font-size: 48px;
      font-weight: 700;
      color: #7a3e27;
    }

    .product-images {
      position: absolute;
      right: 40px;
      top: 30px;
      width: 360px;
      height: 280px;
      z-index: 6;
      pointer-events: none;
    }

    .item-drink {
      position: absolute;
      left: 20px;
      bottom: 60px;
      height: 230px;
      filter: drop-shadow(0 15px 15px rgba(0,0,0,0.2));
    }

    .item-food {
      position: absolute;
      right: 10px;
      bottom: 60px;
      height: 160px;
      filter: drop-shadow(0 15px 15px rgba(0,0,0,0.2));
    }
  </style>
</head>
<body>

  <div class="banner-container">
    <div class="ribbon"><span>NEW</span></div>

    <svg class="banner-bg" viewBox="0 0 1000 400" preserveAspectRatio="none">
      <path fill="#5e301e" d="M0,0 L1000,0 L1000,70 Q900,120 800,90 Q650,40 500,200 Q350,360 0,380 Z" />
      <path fill="#8d4f36" d="M0,0 L1000,0 L1000,40 Q850,140 700,80 Q520,0 350,160 Q180,330 0,270 Z" />
      <path fill="#a7664c" opacity="0.4" d="M0,240 Q200,380 400,200 Q600,20 1000,110 L1000,140 Q600,50 400,230 Q200,410 0,270 Z" />
    </svg>

    <div class="text-content">
      <h1 class="title-top">Evening Set</h1>
      <h2 class="title-middle">With</h2>
      <h1 class="title-brand">CakeryCharm</h1>
    </div>

    <div class="product-card">
      <div class="price-tag">Set 5$</div>
    </div>

    <div class="product-images">
      <img class="item-drink" src="../../images/menu/cokacola.png" alt="Coca Cola">
      <img class="item-food" src="../../images/chocolate.png" alt="Pizza / Pastry">
    </div>
  </div>

</body>
</html>
